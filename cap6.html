<!doctype html>
<!-- Comentari: cap6.html - Capítol 6 Imatges i objectes -->
<html lang="ca">
  <head>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Capítol 6 - Imatges i objectes</title>
    <style>
      /* Comentari CSS: estil per centrar i fer les imatges més grans */
      body { text-align: center; font-family: Arial, Helvetica, sans-serif; }
      figure { display: inline-block; margin: 1rem; }
      figure img { width: 600px; max-width: 100%; height: auto; display: block; }
      figcaption { text-align: center; margin-top: 0.5rem; }
      /* Estil per a la descripció del Renault Clio V6 i Everest */
      figure p.descripcion {
        max-width: 600px;
        margin: 0.5rem auto 0;
        text-align: center;
        font-size: 0.95rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Capítol 6 — Imatges i objectes</h1>
    <!-- Comentari: Inserir dues imatges representatives amb alt -->
    <figure>
      <img src="images/Everest.jpg" alt="Everest">
      <p class="descripcion">
        El <strong>Mont Everest</strong> amb els seus <strong>8.848 metres d’altura</strong>, és el somni de molts alpinistes i aventurers de tot el planeta. Aquest gegant desafia tot aquell que vol conquerir-lo amb el seu clima extrem, els vents gelats i el terreny inhòspit. Ascendir-lo és una proesa que requereix una preparació mental i física brutal, però la recompensa és incomparable: una vista espectacular que sembla abraçar l’infinit.
        <br><br>
        Les seves <strong>pendents glacials</strong> i les condicions adverses han creat una llegenda, una muntanya que no només és un desafiament físic, sinó també espiritual. L' Everest ha estat testimoni de moltes històries de superació i tragèdies, però també de l’esperança i la força humana per arribar a l’inimaginable. Si algun lloc pot fer-te sentir petit i, alhora, més gran que mai, és sens dubte l'<strong>Everest</strong>.
      </p>
      <figcaption>Everest</figcaption>
    </figure>

    <figure>
      <img src="images/Renault-Clio-V6.jpg" alt="Renault Clio V6">
      <p class="descripcion">
        El <strong>Renault Clio V6</strong> és una joia poc convencional, un cotxe compacte que es converteix en una bèstia de carretera. Amb el seu motor <strong>V6 de 3.0 litres</strong> a la part posterior, ofereix una potència de <strong>230 CV</strong> que el fa sentir com una màquina de competició, tot en un cos petit i àgil. Quan arrenca, la seva acceleració et fa sentir cada cavall com una explosió de força pura, i les seves prestacions són tan bones com qualsevol cotxe esportiu de gamma alta.
        <br><br>
        El disseny exterior és agressiu, amb línies amples, un para-xocs gran i una estètica que crida l'atenció. El Clio V6 no passa desapercebut; fa saber que estàs darrere d'un vehicle especial. I dins, tot i ser esportiu, encara conserva comoditat per als ocupants, amb una conducció precisa i una estabilitat que et fa sentir en control, fins i tot a les velocitats més altes.
        És un cotxe pensat per aquells que busquen emoció, però amb la garantia que cada detall està pensat per oferir una experiència única i excitant.
      </p>
      <figcaption>Renault Clio V6</figcaption>
    </figure>
  </body>
</html>
