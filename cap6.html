<!doctype html>
<!-- Comentari: cap6.html - Capítol 6 Imatges i objectes -->
<html lang="ca">
  <head>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Capítol 6 - Imatges i objectes</title>
    <style>
      /* Comentari CSS: estil per centrar i fer les imatges més grans */
      body { text-align: center; font-family: Arial, Helvetica, sans-serif; }
      figure { display: inline-block; margin: 1rem; }
      figure img { width: 600px; max-width: 100%; height: auto; display: block; }
      figcaption { text-align: center; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Capítol 6 — Imatges i objectes</h1>
    <!-- Comentari: Inserir dues imatges representatives amb alt -->
    <figure>
      <img src="images/Everest.jpg" alt="Everest">
      <figcaption>Everest</figcaption>
    </figure>

    <figure>
      <img src="images/Renault-Clio-V6.jpg" alt="Renault Clio V6">
      <figcaption>Renault Clio V6</figcaption>
    </figure>
  </body>
</html>
