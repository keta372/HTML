<!doctype html>
<!-- Comentari: cap6.html - Capítol 6 Imatges i objectes -->
<html lang="ca">
  <head>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Capítol 6 - Imatges i objectes</title>
    <style>
      /* Estils generals */
      :root {
        --img-height: 360px;
        --img-max-width: 600px;
      }

      body {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 1.5rem;
        background: #fafafa;
      }

      h1 { margin-bottom: 1.25rem; }

      /* Galeria: les figures s'alineen per la base perquè quedin a la mateixa altura */
      main.gallery {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      figure {
        width: min(48%, var(--img-max-width));
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
        border-radius: 8px;
        padding: 0.75rem;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      }

      /* Contenidor d'imatge per forçar la mateixa alçada visual */
      .image-wrap { order: 1; width: 100%; height: var(--img-height); overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #e9eef6; }

      figure img {
        width: 100%;
        height: auto;
        object-fit: cover;
        display: block;
      }

      figcaption { order: 2; margin: 0.5rem 0 0.25rem; font-weight: 700; color: #0b4666; }

      p.descripcion { order: 3; max-width: 100%; margin: 0; padding-top: 0.25rem; text-align: center; font-size: 0.95rem; color: #333; line-height: 1.45; }

      @media (max-width: 700px) {
        figure { width: 100%; }
      }
    </style>
  </head>
  <body>
    <h1>Capítol 6 — Imatges i objectes</h1>

    <main class="gallery">
      <figure>
        <div class="image-wrap">
          <img src="images/Everest.jpg" alt="Everest">
        </div>
        <p class="descripcion">
          El <strong>Monte Everest</strong> és el rei de totes les muntanyes, el sostre del món. Amb els seus <strong>8.848 metres d’altura</strong>, és el somni de molts alpinistes i aventurers de tot el planeta. Aquest gegant, situat a la frontera entre <strong>Nepal</strong> i <strong>Tibet</strong>, desafia tot aquell que vol conquerir-lo amb el seu clima extrem, els vents gelats i el terreny inhòspit. Ascendir-lo és una proesa que requereix una preparació mental i física brutal, però la recompensa és incomparable: una vista espectacular que sembla abraçar l’infinit.
          <br><br>
          Les seves <strong>pendents glacials</strong> i les condicions adverses han creat una llegenda, una muntanya que no només és un desafiament físic, sinó també espiritual. El Everest ha estat testimoni de moltes històries de superació i tragèdies, però també de l’esperança i la força humana per arribar a l’inimaginable. Si algun lloc pot fer-te sentir petit i, alhora, més gran que mai, és sens dubte <strong>Everest</strong>.
        </p>
        <figcaption>Everest</figcaption>
      </figure>

      <figure>
        <div class="image-wrap">
          <img src="images/Renault-Clio-V6.jpg" alt="Renault Clio V6">
        </div>
        <p class="descripcion">
          El <strong>Renault Clio V6</strong> és una autèntica icona del món dels cotxes esportius compactes. La seva combinació de potència, disseny atrevit i rendiment excepcional el converteix en un vehicle que ofereix una experiència única. Amb un motor <strong>V6 de 3.0 litres</strong> situat a la part posterior, aquest petit monstre pot accelerar de 0 a 100 km/h en un temps que et farà sentir com si estiguessis volant.
          <br><br>
          Amb el seu aspecte robust, el Clio V6 no només és un cotxe per conduir, sinó una obra d'art sobre rodes, un símbol de passió i rendiment. Tot i la seva mida compacta, no et deixis enganyar; és una bèstia dissenyada per als més apassionats, aquells que busquen emoció pura i sensacions extremes.
          Avui en dia, cotxes com el Clio V6 són cada cop més difícils de trobar, i és que aquest model representa una època on el caràcter i l’esperit esportiu prevalien sobre els estàndards de la indústria. És una joia que, sens dubte, farà somiar a qualsevol amant de l'automòbil.
        </p>
        <figcaption>Renault Clio V6</figcaption>
      </figure>
    </main>
  </body>
</html>
